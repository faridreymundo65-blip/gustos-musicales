<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availability Table</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="board">
        <header class="board-head">
            <p class="eyebrow">Equipo de producto</p>
            <h1>Cuándo coincidimos</h1>
            <p class="lede">Cada celda muestra cuánta gente está libre en esa franja. Cuanto más claro, más gente.</p>
        </header>

        <div class="table-scroll">
            <table>
                <caption>Weekly Meeting Availability Schedule</caption>
                <tr>
                    <th scope="col">Hora</th>
                    <th scope="col">Lunes</th>
                    <th scope="col">Martes</th>
                    <th scope="col">Miércoles</th>
                    <th scope="col">Jueves</th>
                    <th scope="col">Viernes</th>
                </tr>
                <tr class="sharp">
                    <th class="time" scope="row">9:00</th>
                    <td class="available-2" aria-label="2 available"></td>
                    <td class="available-4" aria-label="4 available"></td>
                    <td class="available-1" aria-label="1 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-5" aria-label="5+ available"></td>
                </tr>
                <tr class="half">
                    <th class="time" scope="row">9:30</th>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-5" aria-label="5+ available"></td>
                    <td class="available-2" aria-label="2 available"></td>
                    <td class="available-4" aria-label="4 available"></td>
                    <td class="available-5" aria-label="5+ available"></td>
                </tr>
                <tr class="sharp">
                    <th class="time" scope="row">10:00</th>
                    <td class="available-5" aria-label="5+ available"></td>
                    <td class="available-4" aria-label="4 available"></td>
                    <td class="available-4" aria-label="4 available"></td>
                    <td class="available-2" aria-label="2 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                </tr>
                <tr class="half">
                    <th class="time" scope="row">10:30</th>
                    <td class="available-4" aria-label="4 available"></td>
                    <td class="available-2" aria-label="2 available"></td>
                    <td class="available-5" aria-label="5+ available"></td>
                    <td class="available-1" aria-label="1 available"></td>
                    <td class="available-2" aria-label="2 available"></td>
                </tr>
                <tr class="sharp">
                    <th class="time" scope="row">11:00</th>
                    <td class="available-1" aria-label="1 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-0" aria-label="0 available"></td>
                    <td class="available-4" aria-label="4 available"></td>
                </tr>
                <tr class="half">
                    <th class="time" scope="row">11:30</th>
                    <td class="available-0" aria-label="0 available"></td>
                    <td class="available-1" aria-label="1 available"></td>
                    <td class="available-2" aria-label="2 available"></td>
                    <td class="available-0" aria-label="0 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                </tr>
            </table>
        </div>

        <div id="legend">
            <span>Availability</span>
            <div id="legend-gradient"></div>
            <div class="scale">
                <b>0</b>
                <b>5+</b>
            </div>
        </div>
    </main>
</body>

</html>
